<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f2">
    <link rel="stylesheet" href="styles.css?v=7">
    <script src="auth-page.js?v=6" type="module"></script>
    <title>Create account | Daybook</title>
  </head>
  <body data-account-page="register">
    <main class="account-shell">
      <a class="brand account-brand" href="index.html"><span class="brand-mark">d.</span><span>daybook</span></a>
      <section class="account-card">
        <p class="eyebrow">MAKE ROOM FOR GOOD ROUTINES</p>
        <h1>Create your account</h1>
        <p class="account-intro">Your account keeps your tracker synced across your devices.</p>
        <form id="register-form" class="account-form">
          <label>Your name<input id="register-name" type="text" maxlength="60" autocomplete="name" required></label>
          <label>Email<input id="register-email" type="email" autocomplete="email" required></label>
          <label>Password<input id="register-password" type="password" minlength="6" autocomplete="new-password" required><small>Use at least 6 characters.</small></label>
          <p id="account-error" class="form-error hidden" role="alert"></p>
          <button id="account-submit" class="button button-dark account-submit" type="submit">Create account</button>
        </form>
        <p class="account-switch">Already registered? <a href="login.html">Sign in</a></p>
        <p id="firebase-setup-note" class="setup-note"></p>
        <a class="back-link" href="index.html">Continue in local mode</a>
      </section>
      <p class="account-footer">Your private daily space for steady habits and mindful spending.</p>
    </main>
  </body>
</html>
